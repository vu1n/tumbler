# Tests on every pull request and push. On main, once the tests pass, D1 migrations apply and the
# Worker deploys. The deploy job runs only after the repo has CLOUDFLARE_ACCOUNT_ID set as a variable
# and CLOUDFLARE_API_TOKEN as a secret (see README, "Deploy from GitHub").
name: ci
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run typecheck

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.CLOUDFLARE_ACCOUNT_ID != ''
    runs-on: ubuntu-latest
    environment: production
    # One deploy at a time, and a newer push waits rather than cancelling one mid-migration.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    defaults:
      run:
        working-directory: worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
      - name: Refuse to deploy an unconfigured wrangler.jsonc
        run: |
          if grep -q '<your-' wrangler.jsonc || ! grep -q '"database_id"' wrangler.jsonc; then
            echo "::error::wrangler.jsonc still needs this install's D1 database_id and Secrets Store store_id"; exit 1
          fi
      # Migrations first: the code being deployed may need the new schema. They are additive, so the
      # Worker still running keeps working against it.
      - run: npx wrangler d1 migrations apply DB --remote
      - run: npx wrangler deploy
